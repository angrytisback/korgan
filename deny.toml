[graph]
targets = []

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0543: chrono is flagged as unmaintained (no known vulnerability).
    # It is a mandatory transitive dependency (sqlx, serde integrations, webauthn-rs) and is
    # only used for timestamps. Re-evaluate by 2027-03-01 or when a maintained release or
    # replacement is available. Keep in sync with the --ignore flag of `cargo audit` in
    # .github/workflows/ci.yml (the owner-managed .cargo/audit.toml is not edited here).
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

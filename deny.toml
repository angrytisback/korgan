[graph]
targets = []

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 / CVE-2026-119375: SQLite WAL information disclosure in libsqlite3-sys < 0.39.0.
    # Korgan uses PostgreSQL & Redis only; SQLite runtime is not reachable.
    "RUSTSEC-2026-0459",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

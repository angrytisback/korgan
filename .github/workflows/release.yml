name: Release & Container Publishing

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  release-binary:
    name: Build Musl Binary (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each architecture is built natively (no emulation).
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static musl binary via Docker
        run: |
          docker build --platform "${{ matrix.platform }}" --target builder -t korgan-builder .
          docker create --name temp-builder korgan-builder
          mkdir -p "target/${{ matrix.target }}/release"
          # The Dockerfile copies the binary to /app/korgan for every architecture.
          docker cp temp-builder:/app/korgan "target/${{ matrix.target }}/release/korgan"
          docker rm temp-builder
          chmod +x "target/${{ matrix.target }}/release/korgan"

      - name: Package release artifact and generate checksums
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE_NAME="korgan-${VERSION}-${{ matrix.target }}.tar.gz"

          tar -czvf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" korgan
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: korgan-${{ matrix.target }}
          path: |
            korgan-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            korgan-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release-binary
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: korgan-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            korgan-${{ github.ref_name }}-*.tar.gz
            korgan-${{ github.ref_name }}-*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-container:
    name: Build & Push Distroless Container (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: release-binary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The arm64 image is built under QEMU emulation, which is slow; the
      # per-architecture binaries above are native.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Distroless Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

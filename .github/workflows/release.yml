name: Release & Container Publishing

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  release-binary:
    name: Build & Publish Musl Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static musl binary via Docker
        run: |
          docker build --target builder -t korgan-builder .
          docker create --name temp-builder korgan-builder
          mkdir -p target/x86_64-unknown-linux-musl/release
          docker cp temp-builder:/app/target/x86_64-unknown-linux-musl/release/korgan target/x86_64-unknown-linux-musl/release/korgan
          docker rm temp-builder
          chmod +x target/x86_64-unknown-linux-musl/release/korgan

      - name: Package release artifact and generate checksums
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE_NAME="korgan-${VERSION}-x86_64-unknown-linux-musl.tar.gz"

          tar -czvf "${ARCHIVE_NAME}" -C target/x86_64-unknown-linux-musl/release korgan
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            korgan-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
            korgan-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz.sha256
          generate_release_notes: true

  publish-container:
    name: Build & Push Distroless Container
    runs-on: ubuntu-latest
    needs: release-binary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Distroless Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
